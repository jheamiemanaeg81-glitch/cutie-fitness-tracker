<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FITROVA ULTIMATE - FIXED</title>
<style>
:root{--pink:#ff2e7e;--dark:#0f0f0f;--card:#1e1e1e;--text:#fff;--gray:#aaa}
.light{--dark:#f5f5f7;--card:#ffffff;--text:#111;--gray:#666}
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,sans-serif}
body{background:var(--dark);color:var(--text);padding:14px;transition:.3s}
.logo{font-size:30px;font-weight:900;text-align:center;margin:10px;letter-spacing:2px}
.logo span{color:var(--pink)}
.card{background:var(--card);border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 4px 20px rgba(0,0,0,.2)}
input{width:100%;padding:12px;margin:6px 0;border-radius:12px;border:none;background:#2a2a2a;color:#fff;font-size:15px}
.light input{background:#eee;color:#111}
button{background:var(--pink);border:none;color:#fff;padding:13px;width:100%;border-radius:12px;font-weight:bold;margin-top:8px}
.hidden{display:none}
.goal-btn{background:#2a2a2a;border:2px solid #333;margin:6px 0;text-align:left;padding:12px;border-radius:12px;width:100%;color:#fff}
.goal-btn.active{border-color:var(--pink);background:#3a1e2a}
.ex-card{background:#2a2a2a;border-radius:16px;margin:10px 0;overflow:hidden}
.ex-card img{width:100%;height:140px;object-fit:cover}
.ex-info{padding:10px;display:flex;justify-content:space-between}
.badge{font-size:10px;padding:4px 8px;border-radius:20px;background:var(--pink);color:#fff}
.badge.home{background:#00c896}
.timer-box{font-size:65px;text-align:center;margin:15px 0;font-weight:900}
.feedback{border-left:4px solid var(--pink);padding:10px;background:#2a1d26;border-radius:0 12px 12px 0;margin:8px 0}
.small{color:var(--gray);font-size:12px}
canvas{width:100%;background:#2a2a2a;border-radius:12px;margin-top:8px}
.ring{width:80px;height:80px;border-radius:50%;display:grid;place-items:center;font-weight:900;margin:auto;background:conic-gradient(var(--pink) 0%, #333 0%)}
.topbar{display:flex;justify-content:space-between;align-items:center}
.water{position:fixed;bottom:20px;left:5%;right:5%;background:var(--pink);padding:12px;border-radius:12px;text-align:center;z-index:999;display:none}
.row{display:flex;gap:8px}
.row input{flex:1}
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">FIT<span>ROVA</span></div>
  <button onclick="toggleMode()" style="width:60px;background:#333">🌙</button>
</div>

<div id="waterPop" class="water">💧 Time to drink 250ml water!</div>

<!-- SIGNUP - FIXED LAYOUT -->
<div id="signupPage" class="card">
<h2>Create Account</h2>
<p class="small">All fields required to calculate BMI</p>
<input id="name" placeholder="Your Name - ex: Jhea">
<div class="row">
  <input id="age" type="number" placeholder="Age">
  <input id="height" type="number" placeholder="Height cm">
</div>
<input id="weight" type="number" placeholder="Weight kg - ex: 55">
<button onclick="goToGoal()">Next - Choose Goal →</button>
</div>

<!-- GOAL -->
<div id="goalPage" class="card hidden">
<h2>Hi <span id="userName"></span>! Goal?</h2>
<button class="goal-btn" onclick="selectGoal(this,'belly')">😣 Belly Fat - Flat stomach</button>
<button class="goal-btn" onclick="selectGoal(this,'flatbutt')">🍑 Flat Butt - Bigger glutes</button>
<button class="goal-btn" onclick="selectGoal(this,'payat')">🦴 Skinny - Muscle mass</button>
<button class="goal-btn" onclick="selectGoal(this,'all')">💪 Fit & Sexy Overall</button>
<button onclick="showWorkouts()">Generate My Plan</button>
</div>

<!-- MAIN -->
<div id="mainPage" class="hidden">
  <div class="card" style="text-align:center">
    <div class="ring" id="progressRing">0%</div>
    <p class="small" id="bmiText"></p>
    <p class="small" id="scheduleInfo"></p>
    <p>🔥 Streak: <span id="streakFire">0</span> days</p>
    <div id="feedback" class="feedback"></div>
    <div id="mealBox" class="card" style="background:#2a1d26;margin:8px 0"></div>
    <canvas id="weightChart" height="160"></canvas>
    <div style="display:flex;gap:6px;margin-top:8px">
      <input id="newWeight" type="number" placeholder="Log new weight">
      <button onclick="logWeight()" style="width:100px">Log</button>
    </div>
    <button onclick="shareProgress()" style="background:#1DA1F2">📤 Share Progress</button>
  </div>

  <div class="card">
    <h3 id="weeklyReport">📊 Weekly Report</h3>
    <p class="small" id="weeklyText"></p>
  </div>

  <div class="card">
    <h3>📸 Before / After</h3>
    <input type="file" id="beforeInput" accept="image/*" onchange="loadPhoto(this,'beforeImg')">
    <img id="beforeImg" style="width:100%;border-radius:12px;margin-top:6px;display:none">
    <input type="file" id="afterInput" accept="image/*" onchange="loadPhoto(this,'afterImg')">
    <img id="afterImg" style="width:100%;border-radius:12px;margin-top:6px;display:none">
  </div>

  <div class="card">
    <h3 id="goalTitle"></h3>
    <div id="workoutList"></div>
    <div id="restYoga" class="hidden"><h4>🧘 Rest Day - Light Stretching Only</h4><p class="small">Cat-Cow 1min, Child Pose 1min, Cobra Stretch 1min</p></div>
  </div>

  <div class="card">
    <p class="small">Start: <span id="startDate"></span> | Last: <span id="lastDate"></span></p>
    <p class="small">Next: <span id="nextDate"></span> | <b id="restStatus"></b></p>
    <button onclick="resetData()" style="background:#333">Reset / Logout</button>
  </div>
</div>

<!-- TIMER -->
<div id="timerModal" class="card hidden" style="position:fixed;top:4%;left:4%;right:4%;z-index:99">
  <img id="timerImg" src="" style="width:100%;height:150px;object-fit:cover;border-radius:12px">
  <h2 id="timerExerciseName"></h2>
  <p class="small" id="timerDesc"></p>
  <div class="timer-box" id="timerDisplay">00:30</div>
  <button id="timerBtn" onclick="startTimer()">Start with Voice</button>
  <button onclick="closeTimer()" style="background:#333">Done</button>
</div>

<script>
let user=JSON.parse(localStorage.getItem('fitrova_user'));let selectedGoal='';let timerInterval,timeLeft;
let exercises=[
{name:'Planking',goal:['belly','all'],type:'home',time:60,desc:'Hold 30-60s. Tight core!',img:'https://images.unsplash.com/photo-1566241142559-40e1dab266c6?w=500'},
{name:'Crunches',goal:['belly','all'],type:'home',time:45,desc:'20 reps x 3',img:'https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?w=500'},
{name:'Squats',goal:['flatbutt','all','payat'],type:'home',time:60,desc:'20 reps deep',img:'https://images.unsplash.com/photo-1574680096145-d05b474e2155?w=500'},
{name:'Glute Bridge',goal:['flatbutt'],type:'home',time:45,desc:'15 reps hold 3s',img:'https://images.unsplash.com/photo-1599058917212-d750089bc07e?w=500'},
{name:'Hip Thrust Gym',goal:['flatbutt'],type:'gym',time:70,desc:'Barbell 12x4',img:'https://images.unsplash.com/photo-1517836357463-d25dfeac3438?w=500'},
{name:'Push-ups',goal:['payat','all'],type:'home',time:40,desc:'10-15 reps',img:'https://images.unsplash.com/photo-1598971639058-fab3c3109a00?w=500'},
{name:'Jumping Jacks',goal:['belly','all'],type:'home',time:60,desc:'Warmup 1min',img:'https://images.unsplash.com/photo-1601422407692-ec4eeec1d9b3?w=500'},
];

function goToGoal(){
let n=document.getElementById('name').value.trim();
let a=document.getElementById('age').value.trim();
let h=document.getElementById('height').value.trim();
let w=document.getElementById('weight').value.trim();
// FIXED VALIDATION - specific message
if(!n){alert('Please enter your Name! ex: Jhea');return;}
if(!a){alert('Please enter your Age! ex: 20');return;}
if(!h){alert('Please enter your Height in cm! ex: 160');document.getElementById('height').focus();return;}
if(!w){alert('Please enter your Weight in kg! ex: 55');document.getElementById('weight').focus();return;}
let bmi=(w/((h/100)*(h/100))).toFixed(1);
user={name:n,age:a,height:h,weight:parseFloat(w),bmi:bmi,startDate:new Date().toLocaleDateString(),lastWorkout:'None',streak:0,weights:[{date:new Date().toLocaleDateString(),w:parseFloat(w)}],logs:[],todayCount:0};
localStorage.setItem('fitrova_user',JSON.stringify(user));
document.getElementById('signupPage').classList.add('hidden');document.getElementById('goalPage').classList.remove('hidden');document.getElementById('userName').innerText=n;
}
function selectGoal(el,g){document.querySelectorAll('.goal-btn').forEach(b=>b.classList.remove('active'));el.classList.add('active');selectedGoal=g;}
function showWorkouts(){
if(!selectedGoal){alert('Choose a goal first!');return;}
document.getElementById('goalPage').classList.add('hidden');document.getElementById('mainPage').classList.remove('hidden');
let titles={belly:'Belly Fat Loss Plan',flatbutt:'Glutes Growth Plan',payat:'Muscle Gain Plan',all:'Fit & Sexy Plan'};
document.getElementById('goalTitle').innerText=titles[selectedGoal];renderAll();startWaterReminder();
}
function renderAll(){renderWorkouts();renderSchedule();renderFeedback();renderMeal();drawChart();renderWeekly();renderRing();checkPhotos();}
function renderWorkouts(){
let list=workoutList;list.innerHTML='';let isRest=new Date().getDay()==0;
if(isRest){restYoga.classList.remove('hidden');}
exercises.filter(e=>e.goal.includes(selectedGoal)).forEach(ex=>{
let div=document.createElement('div');div.className='ex-card';
div.innerHTML=`<img src="${ex.img}"><div class="ex-info"><div><b>${ex.name}</b><br><span class="small">${ex.desc}</span></div><span class="badge ${ex.type}">${ex.type.toUpperCase()}</span></div>`;
div.onclick=()=>openTimer(ex);list.appendChild(div);
});
}
function speak(t){if('speechSynthesis' in window){let u=new SpeechSynthesisUtterance(t);u.rate=1;speechSynthesis.speak(u);}}
function openTimer(ex){timerModal.classList.remove('hidden');timerExerciseName.innerText=ex.name;timerDesc.innerText=ex.desc;timerImg.src=ex.img;timerDisplay.innerText='00:'+String(ex.time).padStart(2,'0');timeLeft=ex.time;window.currentEx=ex;timerBtn.innerText='Start with Voice';speak(`${ex.name}. ${ex.desc}. Let's go!`);}
function startTimer(){
if(timerInterval) return;speak('Starting in 3 2 1 Go!');
timerInterval=setInterval(()=>{timeLeft--;let m=Math.floor(timeLeft/60),s=timeLeft%60;timerDisplay.innerText=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;if(timeLeft==10)speak('10 seconds left, you can do it!');if(timeLeft<=0){clearInterval(timerInterval);timerInterval=null;timerDisplay.innerText='DONE!';speak('Amazing! You finished!');updateLog();}},1000);
}
function closeTimer(){clearInterval(timerInterval);timerInterval=null;timerModal.classList.add('hidden');}
function updateLog(){user.lastWorkout=new Date().toLocaleString();user.streak++;user.todayCount=(user.todayCount||0)+1;user.logs.push(new Date().toISOString());localStorage.setItem('fitrova_user',JSON.stringify(user));renderAll();}
function renderSchedule(){startDate.innerText=user.startDate;lastDate.innerText=user.lastWorkout;let isRest=new Date().getDay()==0;restStatus.innerText=isRest?'REST DAY TODAY':'WORKOUT DAY';nextDate.innerText=isRest?'Monday':'Tomorrow';scheduleInfo.innerText=`${user.name} | ${user.weight}kg | ${user.height}cm`;bmiText.innerText=`BMI: ${user.bmi} - ${getBmiStatus(user.bmi)}`;streakFire.innerText=user.streak+' 🔥';}
function getBmiStatus(b){if(b<18.5)return 'Underweight - need muscle';if(b<25)return 'Normal - maintain!';if(b<30)return 'Overweight - fat loss focus';return 'Obese - consult doctor';}
function renderFeedback(){let s=user.streak||0;let msg=s==0?'Day 1! One workout = win.':s<3?`Nice ${s} workouts! Soreness means progress.`:s<7?`Amazing! ${s} workouts, glutes rounder, belly tighter!`:`BEAST MODE! ${s} workouts! You're transforming!`;feedback.innerText=msg;}
function renderMeal(){let g=selectedGoal,b=user.bmi;let meals={belly:'🥗 Meal: Avoid sugary drinks & rice at night. Eat: Chicken, eggs, veggies, 2L water. BMI '+b+' cut 300 cal.',flatbutt:'🍑 Meal: Protein to grow glutes! 4 eggs, chicken, peanut butter, oats, milk. BMI '+b+' eat +200 cal.',payat:'💪 Meal: Need mass! Rice + chicken, shake, bananas, nuts. 5 meals/day.',all:'🥙 Meal: Balanced: 40% protein, 30% carbs, 30% veggies.'};mealBox.innerText=meals[g];}
function logWeight(){let nw=parseFloat(newWeight.value);if(!nw)return;user.weights.push({date:new Date().toLocaleDateString(),w:nw});user.weight=nw;user.bmi=(nw/((user.height/100)*(user.height/100))).toFixed(1);localStorage.setItem('fitrova_user',JSON.stringify(user));newWeight.value='';renderAll();}
function drawChart(){let c=weightChart,ctx=c.getContext('2d');ctx.clearRect(0,0,c.width,c.height);let ws=user.weights||[];if(ws.length<2){ctx.fillStyle='#aaa';ctx.fillText('Log weight to see graph',10,80);return;}ctx.strokeStyle='#ff2e7e';ctx.lineWidth=3;ctx.beginPath();let max=Math.max(...ws.map(o=>o.w)),min=Math.min(...ws.map(o=>o.w)),range=max-min||1;ws.forEach((p,i)=>{let x=(i/(ws.length-1))*c.width;let y=130-((p.w-min)/range)*100;if(i==0)ctx.moveTo(x,y);else ctx.lineTo(x,y);});ctx.stroke();}
function renderWeekly(){let logs=user.logs||[];let thisWeek=logs.filter(d=>{let date=new Date(d);let now=new Date();return (now-date)/(1000*60*60*24)<7}).length;weeklyText.innerText=`This week: ${thisWeek} workouts. Weight change: ${(user.weights[user.weights.length-1].w-user.weights[0].w).toFixed(1)}kg.`;weeklyReport.innerText=`📊 Weekly Report - ${thisWeek}/5 goal`;}
function renderRing(){let pct=Math.min((user.todayCount||0)/3*100,100);let ring=document.getElementById('progressRing');ring.style.background=`conic-gradient(var(--pink) ${pct}%, #333 ${pct}%)`;ring.innerText=Math.round(pct)+'%';}
function loadPhoto(input,id){let r=new FileReader();r.onload=e=>{localStorage.setItem(id,e.target.result);document.getElementById(id).src=e.target.result;document.getElementById(id).style.display='block';};r.readAsDataURL(input.files[0]);}
function checkPhotos(){let b=localStorage.getItem('beforeImg'),a=localStorage.getItem('afterImg');if(b){beforeImg.src=b;beforeImg.style.display='block';}if(a){afterImg.src=a;afterImg.style.display='block';}}
function startWaterReminder(){setInterval(()=>{waterPop.style.display='block';speak('Time to drink water');setTimeout(()=>waterPop.style.display='none',4000);},1000*60*30);}
function shareProgress(){let text=`I did ${user.streak} workouts with FITROVA! Weight: ${user.weight}kg BMI: ${user.bmi}`;if(navigator.share){navigator.share({title:'FITROVA',text})}else{alert(text);}}
function toggleMode(){document.body.classList.toggle('light');}
function resetData(){localStorage.clear();location.reload();}
if(user){signupPage.classList.add('hidden');goalPage.classList.remove('hidden');userName.innerText=user.name;}
</script>
</body>
</html>
